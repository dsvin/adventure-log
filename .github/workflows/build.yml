name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python deps for icon generation
        run: pip install pillow numpy

      - name: Regenerate icon
        run: python make-icon.py

      - name: Generate icon sizes
        run: npx tauri icon icon-1024.png

      - name: Install frontend dependencies
        run: npm install

      - name: Build
        run: npm run tauri build

      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          draft: false
          prerelease: false

  build-macos:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python deps for icon generation
        run: pip install pillow numpy

      - name: Regenerate icon
        run: python make-icon.py

      - name: Generate icon sizes
        run: npx tauri icon icon-1024.png

      - name: Install frontend dependencies
        run: npm install

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.13"
        run: npm run tauri build

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src-tauri/target/release/bundle/dmg/*.dmg
          draft: false
          prerelease: false
